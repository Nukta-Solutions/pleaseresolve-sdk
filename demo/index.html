<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Please Resolve SDK — demo</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        max-width: 640px;
        margin: 60px auto;
        padding: 0 20px;
        color: #111827;
      }
      h1 { font-size: 20px; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Acme Customer Site</h1>
    <p>
      This is a stand-in for a Please Resolve customer's own website, with the
      widget embedded via the script tag below. Click the floating "Support"
      button in the corner, then "New Issue" or "View Issues".
    </p>
    <p>
      Manual trigger for headless-style testing:
      <button id="manual-open" type="button">Open report form</button>
    </p>

    <script>
      // Dummy data for local/demo viewing only — not part of the real
      // integration snippet below. The data-key/data-project below are
      // fake placeholders, so a real fetch to /public/reports* would
      // always fail; this intercepts just those calls and returns canned
      // data instead, so "View Issues" has something to show. Delete this
      // whole script block (and the DUMMY_REPORTS list) to test the widget
      // against a real project's live data instead.
      (function () {
        var DUMMY_REPORTS = [
          { id: "dummy-1", title: "Checkout button unresponsive on mobile", status: "new", priority: "high", createdAt: "2026-09-21T11:40:00.000Z", dueDate: null, description: "Tapping the checkout button on iOS Safari does nothing.", reporterName: "Jessica L", projectName: "Acme Customer Site", attachments: [] },
          { id: "dummy-2", title: "Dashboard chart flickers on resize", status: "in_progress", priority: "medium", createdAt: "2026-09-20T09:15:00.000Z", dueDate: "2026-09-25T00:00:00.000Z", description: "Resizing the browser window rapidly makes the revenue chart flicker and occasionally render blank.", reporterName: "Miguel R", projectName: "Acme Customer Site", attachments: [] },
          { id: "dummy-3", title: "Typo in invoice footer", status: "resolved", priority: "low", createdAt: "2026-09-18T14:02:00.000Z", dueDate: null, description: "Footer says \"Thnak you\" instead of \"Thank you\".", reporterName: "Aisha K", projectName: "Acme Customer Site", attachments: [] },
          { id: "dummy-4", title: "Export to CSV times out on large datasets", status: "blocked", priority: "high", createdAt: "2026-09-15T17:51:00.000Z", dueDate: "2026-09-30T00:00:00.000Z", description: "Exporting more than ~5,000 rows always times out after 30s.", reporterName: null, projectName: "Acme Customer Site", attachments: [] },
          { id: "dummy-5", title: "Search results ignore date filter", status: "new", priority: "medium", createdAt: "2026-09-14T08:22:00.000Z", dueDate: null, description: "Applying a date range in search doesn't narrow the results at all.", reporterName: "Tom H", projectName: "Acme Customer Site", attachments: [] },
          { id: "dummy-6", title: "Old test issue", status: "closed", priority: "low", createdAt: "2026-09-10T16:45:00.000Z", dueDate: null, description: "Closed out after confirming it was a one-off.", reporterName: "Jessica L", projectName: "Acme Customer Site", attachments: [] },
        ];

        var originalFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : input.url;
          if (init && init.method && init.method.toUpperCase() !== "GET") {
            return originalFetch(input, init);
          }

          function jsonResponse(data) {
            return Promise.resolve(
              new Response(JSON.stringify({ success: true, data: data }), {
                status: 200,
                headers: { "Content-Type": "application/json" },
              }),
            );
          }

          if (/\/public\/reports\/[^/?]+\/messages(?:\?|$)/.test(url)) {
            return jsonResponse([]);
          }
          var detailMatch = url.match(/\/public\/reports\/([^/?]+)(?:\?|$)/);
          if (detailMatch) {
            var found = DUMMY_REPORTS.find(function (r) {
              return r.id === detailMatch[1];
            });
            return jsonResponse(found || null);
          }
          if (/\/public\/reports(?:\?|$)/.test(url)) {
            return jsonResponse(DUMMY_REPORTS);
          }
          return originalFetch(input, init);
        };
      })();
    </script>

    <!--
      The actual integration snippet, exactly as a customer would paste it.
      Replace the two data-* values below with a real public key from
      Settings → API Keys (keyType: "public") and its project id.
      `data-api-base-url` is only needed to point at something other than
      the production API (e.g. `http://localhost:5000/api/v1` for local
      testing — see test-e2e.mjs, which substitutes real local values into
      a copy of this file rather than editing it in place).
    -->
    <script
      src="../dist/widget.global.js"
      data-key="pk_live_your_public_key_here"
      data-project="your_project_id_here"
    ></script>

    <script>
      document.getElementById("manual-open").addEventListener("click", () => {
        window.PleaseResolve.open();
      });
    </script>
  </body>
</html>
